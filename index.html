<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Happy Birthday, Jani</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --oxblood: #3d0808;
            --oxblood-deep: #2a0505;
            --rose: #b9a2a8;
            --silver: #d8d8d8;
            --ink: #0d0a0a;
            --script: "Pinyon Script", "Snell Roundhand", cursive;
            --serif: "Cormorant Garamond", Georgia, serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            height: 100%;
            background: #000;
            color: var(--rose);
            font-family: var(--serif)
        }

        body {
            display: flex;
            justify-content: center;
            overflow: hidden
        }

        #app {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            background: var(--oxblood);
            overflow: hidden
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: calc(env(safe-area-inset-top, 0px) + 8vh) 24px calc(env(safe-area-inset-bottom, 0px) + 5vh);
            opacity: 0;
            pointer-events: none;
            transition: opacity .8s ease
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto
        }

        .kicker {
            font-size: 15px;
            letter-spacing: .38em;
            text-transform: uppercase;
            color: #e6dcdf;
            text-align: center
        }

        .title {
            font-family: var(--script);
            font-size: clamp(54px, 17vw, 84px);
            line-height: 1.05;
            text-align: center;
            margin-top: 3vh;
            color: var(--rose)
        }

        .cta {
            margin-top: auto;
            font-size: 17px;
            letter-spacing: .45em;
            text-transform: uppercase;
            color: #f0e8ea;
            background: none;
            border: 0;
            padding: 12px 18px;
            cursor: pointer;
            font-family: var(--serif)
        }

        .cta:focus-visible,
        .nav button:focus-visible,
        .frame:focus-visible,
        .shot:focus-visible {
            outline: 2px solid var(--rose);
            outline-offset: 4px
        }

        /* ---------- photo booth ---------- */
        .machine {
            margin-top: 5vh;
            cursor: pointer;
            background: none;
            border: 0
        }

        .frame {
            position: relative;
            width: min(46vw, 200px);
            aspect-ratio: 1/2.6;
            padding: 9px;
            border-radius: 4px;
            background: linear-gradient(100deg, #5b5b5b 0%, #f4f4f4 14%, #777 30%, #1b1b1b 55%, #e8e8e8 85%, #666 100%);
            box-shadow: 0 18px 40px rgba(0, 0, 0, .55)
        }

        .slot {
            position: relative;
            width: 100%;
            height: 100%;
            background: #050505;
            overflow: hidden;
            box-shadow: inset 0 0 0 3px #bdbdbd, inset 0 10px 18px rgba(0, 0, 0, .9)
        }

        .strip-mini {
            position: absolute;
            left: 12%;
            right: 12%;
            top: 6%;
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: #1a1a1a;
            padding: 3px;
            transition: transform 1.1s cubic-bezier(.5, 0, .2, 1)
        }

        .strip-mini img {
            display: block;
            width: 100%;
            aspect-ratio: 3/3.4;
            object-fit: cover;
            filter: grayscale(1) sepia(.25) contrast(1.05)
        }

        .machine.opening .strip-mini {
            transform: translateY(60%)
        }

        .machine.opening .frame {
            animation: shake .5s ease 2
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-2px)
            }

            75% {
                transform: translateX(2px)
            }
        }

        /* ---------- strip gallery ---------- */
        #gallery {
            padding-left: 0;
            padding-right: 0
        }

        #gallery .hint {
            margin: 0 24px 2vh;
            font-style: italic;
            font-size: 19px;
            color: var(--rose);
            text-align: center
        }

        .scroller {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            padding: 0 0 6vh;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none
        }

        .scroller::-webkit-scrollbar {
            display: none
        }

        .strip {
            width: min(62vw, 270px);
            height: max-content;
            background: #f2ece4;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .5);
            transform: translateY(-110%);
            transition: transform 1.4s cubic-bezier(.2, .8, .2, 1)
        }

        #gallery.active .strip {
            transform: translateY(0)
        }

        .shot {
            border: 0;
            background: #111;
            padding: 0;
            cursor: pointer;
            display: block;
            overflow: hidden
        }

        .shot img {
            display: block;
            width: 100%;
            aspect-ratio: 3/3.6;
            object-fit: cover;
            filter: grayscale(1) sepia(.3) contrast(1.05);
            transition: filter .3s, transform .4s
        }

        .shot:hover img,
        .shot:focus-visible img {
            filter: none;
            transform: scale(1.04)
        }

        /* ---------- reasons ---------- */
        #intro2 .title {
            font-size: clamp(40px, 12vw, 60px);
            margin-top: 12vh
        }

        #intro2 .kicker {
            margin-top: 4vh
        }

        .count {
            font-size: 15px;
            letter-spacing: .38em;
            text-transform: uppercase;
            color: #e6dcdf
        }

        .polaroid {
            margin-top: 3vh;
            background: #f2ece4;
            padding: 10px 10px 0;
            width: min(72vw, 320px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, .5);
            transition: opacity .5s, transform .5s
        }

        .polaroid img {
            display: block;
            width: 100%;
            aspect-ratio: 4/5;
            object-fit: cover;
            background: #222
        }

        .polaroid .cap {
            height: 12px
        }

        .reason {
            margin-top: 3vh;
            font-family: var(--script);
            font-size: clamp(26px, 8vw, 36px);
            line-height: 1.25;
            text-align: center;
            color: #e6dcdf;
            min-height: 3.8em;
            transition: opacity .5s
        }

        .swap .polaroid,
        .swap .reason {
            opacity: 0;
            transform: translateY(8px)
        }

        .nav {
            margin-top: auto;
            display: flex;
            gap: 28px;
            align-items: center
        }

        .nav button {
            background: none;
            border: 1px solid var(--rose);
            color: var(--rose);
            font-family: var(--serif);
            font-size: 16px;
            letter-spacing: .3em;
            text-transform: uppercase;
            padding: 12px 22px;
            cursor: pointer;
            border-radius: 2px
        }

        .nav button:disabled {
            opacity: .25;
            cursor: default
        }

        /* ---------- video + finale ---------- */
        #finale .title {
            margin-top: 2vh;
            font-size: clamp(44px, 14vw, 68px)
        }

        video {
            width: 100%;
            max-height: 52vh;
            margin-top: 3vh;
            background: #000;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .5)
        }

        .note {
            margin-top: 3vh;
            font-style: italic;
            font-size: 20px;
            text-align: center;
            color: #e6dcdf;
            max-width: 30ch
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                transition-duration: .01s !important;
                animation: none !important
            }
        }
    </style>
</head>

<body>
    <div id="app">

        <!-- 1. Opening: the photo booth -->
        <section class="screen active" id="intro">
            <p class="kicker">A special surprise is coming for</p>
            <h1 class="title" id="introTitle"></h1>
            <button class="machine" id="machine" aria-label="Tap to open the photo strip">
                <div class="frame">
                    <div class="slot">
                        <div class="strip-mini" id="miniStrip"></div>
                    </div>
                </div>
            </button>
            <button class="cta" id="openBtn">Tap to open</button>
        </section>

        <!-- 2. The strip comes out -->
        <section class="screen" id="gallery">
            <p class="hint" id="galleryHint"></p>
            <div class="scroller">
                <div class="strip" id="strip"></div>
            </div>
        </section>

        <!-- 3. Title card -->
        <section class="screen" id="intro2">
            <p class="kicker" id="i2kicker"></p>
            <h2 class="title" id="i2title"></h2>
            <button class="cta" id="startReasons">Begin</button>
        </section>

        <!-- 4. The reasons -->
        <section class="screen" id="reasons">
            <p class="count" id="count"></p>
            <div class="polaroid"><img id="rImg" alt="">
                <div class="cap"></div>
            </div>
            <p class="reason" id="rText"></p>
            <div class="nav">
                <button id="prev">Back</button>
                <button id="next">Next</button>
            </div>
        </section>

        <!-- 5. Video + finale -->
        <section class="screen" id="finale">
            <h2 class="title" id="finTitle"></h2>
            <video id="vid" controls playsinline preload="metadata"></video>
            <p class="note" id="finNote"></p>
            <button class="cta" id="replay">Start over</button>
        </section>
    </div>

    <script>
        /* =====================================================================
           EDIT THIS PART ONLY
           - Put photos in the /photos folder, video in the /video folder
           - Change the file names below to match yours
           ===================================================================== */
        const CONFIG = {
            name: "Jaanii",
            age: 21,

            // Photos shown on the strip that slides out. Add or remove as you like.
            // The first 4 also appear inside the photo booth on the opening screen.
            stripPhotos: [
                "photos/strip1.jpg", "photos/strip2.jpg", "photos/strip3.jpg",
                "photos/strip4.jpg", "photos/strip5.jpg", "photos/strip6.jpg"
            ],

            // One entry per reason. Write your own text and point to her photo.
            reasons: [
                { text: "You’re the best friend anyone could ask for.", photo: "photos/01.jpg" },
                { text: "You make every room feel warmer.", photo: "photos/02.jpg" },
                { text: "You tell the best stories.", photo: "photos/03.jpg" },
                { text: "You work hard and still make time for everyone.", photo: "photos/04.jpg" },
                { text: "You have an incredible talent for making people feel special.", photo: "photos/05.jpg" },
                { text: "You always stay when things get hard.", photo: "photos/06.jpg" },
                { text: "You can sleep through an earthquake.", photo: "photos/07.jpg" },
                { text: "You love your tea both herbal and verbal.", photo: "photos/08.jpg" },
                { text: "You learned to swim in one hour.", photo: "photos/09.jpg" },
                { text: "You let me do ur eyeliner n mehendhi.", photo: "photos/10.jpg" },
                { text: "You love elephants.", photo: "photos/11.jpg" },
                { text: "You love your friends fiercely", photo: "photos/12.jpg" },
                { text: "You push people out of their comfort zone.", photo: "photos/13.jpg" },
                { text: "You live by “seek the discomfort”.", photo: "photos/14.jpg" },
                { text: "You make everyone around you better.", photo: "photos/15.jpg" },
                { text: "“You’re good at everything you try.”        ", photo: "photos/16.jpg" },
                { text: "You’re one special humannnnn.", photo: "photos/17.jpg" },
                { text: "You’re the first to cheer for others.", photo: "photos/18.jpg" },
                { text: "You make people laugh.", photo: "photos/19.jpg" },
                { text: "You always find a way.", photo: "photos/20.jpg" },
                { text: "You’re my only favorite person .", photo: "photos/21.jpg" }
            ],

            video: "videos/birthday.mp4",
            finalNote: "Happy birthday. I love you."
        };
        /* ===================================================================== */

        const $ = id => document.getElementById(id);
        const PLACEHOLDER = p => "data:image/svg+xml;utf8," + encodeURIComponent(
            `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='500'><rect width='100%' height='100%' fill='#2a2222'/><text x='50%' y='48%' fill='#b9a2a8' font-family='Georgia' font-size='22' text-anchor='middle'>Add photo</text><text x='50%' y='55%' fill='#7a6a6e' font-family='monospace' font-size='15' text-anchor='middle'>${p}</text></svg>`);
        function img(src, cls) {
            const i = new Image(); i.src = src; i.alt = ""; if (cls) i.className = cls;
            i.onerror = () => { i.onerror = null; i.src = PLACEHOLDER(src); };
            return i;
        }
        function show(id) {
            document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
        }

        /* text */
        $("introTitle").textContent = `Happy Birthday, ${CONFIG.name}`;
        $("galleryHint").textContent = "Pick a picture";
        $("i2kicker").textContent = "Here are";
        $("i2title").textContent = `${CONFIG.age} reasons why you are my favorite`;
        $("finTitle").textContent = `Happy Birthday, ${CONFIG.name}`;
        $("finNote").textContent = CONFIG.finalNote;

        /* booth strip */
        CONFIG.stripPhotos.slice(0, 4).forEach(p => $("miniStrip").appendChild(img(p)));

        /* gallery strip */
        CONFIG.stripPhotos.forEach(p => {
            const b = document.createElement("button");
            b.className = "shot"; b.setAttribute("aria-label", "Open reasons");
            b.appendChild(img(p));
            b.onclick = () => showIntro2();
            $("strip").appendChild(b);
        });

        /* flow */
        let opened = false;
        function openMachine() {
            if (opened) return; opened = true;
            $("machine").classList.add("opening");
            setTimeout(() => show("gallery"), 1500);
        }
        $("machine").onclick = openMachine;
        $("openBtn").onclick = openMachine;

        function showIntro2() { show("intro2"); }
        $("startReasons").onclick = () => { idx = 0; render(false); show("reasons"); };

        let idx = 0;
        const N = CONFIG.reasons.length;
        function render(animate = true) {
            const r = CONFIG.reasons[idx];
            const apply = () => {
                $("count").textContent = `Reason ${idx + 1} of ${N}`;
                const el = $("rImg"); el.onerror = () => { el.onerror = null; el.src = PLACEHOLDER(r.photo); };
                el.src = r.photo;
                $("rText").textContent = r.text;
                $("prev").disabled = idx === 0;
                $("next").textContent = idx === N - 1 ? "Finish" : "Next";
                $("reasons").classList.remove("swap");
            };
            if (!animate) { apply(); return; }
            $("reasons").classList.add("swap");
            setTimeout(apply, 350);
        }
        function next() {
            if (idx < N - 1) { idx++; render(); }
            else { goFinale(); }
        }
        function prev() { if (idx > 0) { idx--; render(); } }
        $("next").onclick = next; $("prev").onclick = prev;
        document.addEventListener("keydown", e => {
            if (!$("reasons").classList.contains("active")) return;
            if (e.key === "ArrowRight") next();
            if (e.key === "ArrowLeft") prev();
        });
        let sx = null;
        $("reasons").addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
        $("reasons").addEventListener("touchend", e => {
            if (sx === null) return;
            const dx = e.changedTouches[0].clientX - sx; sx = null;
            if (dx < -50) next(); else if (dx > 50) prev();
        });

        function goFinale() {
            show("finale");
            const v = $("vid");
            if (!v.src) v.src = CONFIG.video;
            v.play().catch(() => { });
        }
        $("replay").onclick = () => {
            $("vid").pause(); idx = 0; opened = false;
            $("machine").classList.remove("opening");
            show("intro");
        };
    </script>
</body>

</html>
